    <!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
</head>
<body>

    <h1>Product List</h1>

    {{ for product in products }}
        <div>
            <h2>Product ID: {{ product[0][0] }}</h2>
            <p>Product Name: {{ product[0] [1] }}</p>
            <p>Price: ₹{{ product[0][2]  }}</p>
        </div>
        <hr>
        <div>
            <h2>Product ID: {{ product[1][0] }}</h2>
            <p>Product Name: {{ product[1] [1] }}</p>
            <p>Price: ₹{{ product[1][2]  }}</p>
        </div>
        <hr>
    {{ endfor }}

</body>
</html>
